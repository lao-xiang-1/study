<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 坐标轴箭头 -->
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <!-- 冲激箭头 -->
    <marker id="imp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- ==================== 阶段1：原始信号 ==================== -->
  <g id="stage1">
    <text x="40" y="35" font-size="16" font-weight="bold" fill="#1e293b" font-family="system-ui, sans-serif">① 原始信号 x(t)</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="130" x2="720" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <line x1="80" y1="130" x2="80" y2="60" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="730" y="135" font-size="14" fill="#374151">t</text>
    <text x="60" y="65" font-size="14" fill="#374151">x(t)</text>
    <!-- 信号曲线 x(t)=2+2sin(t), y映射: 90-40sin(t) -->
    <path d="M80,90 L120,70.8 L160,56.3 L200,50.1 L240,53.6 L280,66.1 L320,84.4 L360,104.0 L400,120.3 L440,129.1 L480,128.4 L520,118.2 L560,101.2 L600,81.4 L640,63.7 L680,52.5 L720,50.4" 
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- ==================== 阶段2：矩形近似 ==================== -->
  <g id="stage2" transform="translate(0, 140)">
    <text x="40" y="35" font-size="16" font-weight="bold" fill="#1e293b" font-family="system-ui, sans-serif">② 切分为矩形 (宽度 Δτ)</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="130" x2="720" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <line x1="80" y1="130" x2="80" y2="60" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    
    <!-- 背景虚线曲线 -->
    <path d="M80,90 L120,70.8 L160,56.3 L200,50.1 L240,53.6 L280,66.1 L320,84.4 L360,104.0 L400,120.3 L440,129.1 L480,128.4 L520,118.2 L560,101.2 L600,81.4 L640,63.7 L680,52.5 L720,50.4" 
          fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- 矩形（中心τ=1..7, 宽Δτ=0.8→64px） -->
    <rect x="128" y="56.3" width="64" height="73.7" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="208" y="53.6" width="64" height="76.4" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="288" y="84.4" width="64" height="45.6" fill="rgba(37,99,235,0.18)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="368" y="120.3" width="64" height="9.7" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="448" y="128.4" width="64" height="1.6" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="528" y="101.2" width="64" height="28.8" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="608" y="63.7" width="64" height="66.3" fill="rgba(37,99,235,0.12)" stroke="#3b82f6" stroke-width="1.5"/>
    
    <!-- Δτ 双向箭头 -->
    <line x1="288" y1="148" x2="352" y2="148" stroke="#374151" stroke-width="1.2"/>
    <path d="M288,148 L294,145 L294,151 Z" fill="#374151"/>
    <path d="M352,148 L346,145 L346,151 Z" fill="#374151"/>
    <text x="320" y="165" font-size="14" text-anchor="middle" fill="#374151" font-weight="500">Δτ</text>
    
    <!-- 面积标注 -->
    <text x="320" y="75" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">x(τ)·Δτ</text>
  </g>

  <!-- ==================== 阶段3：冲激序列 ==================== -->
  <g id="stage3" transform="translate(0, 280)">
    <text x="40" y="35" font-size="16" font-weight="bold" fill="#1e293b" font-family="system-ui, sans-serif">③ 极限：矩形变为冲激 (Δτ→0)</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="130" x2="720" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <line x1="80" y1="130" x2="80" y2="60" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    
    <!-- 背景虚线曲线（更浅） -->
    <path d="M80,90 L120,70.8 L160,56.3 L200,50.1 L240,53.6 L280,66.1 L320,84.4 L360,104.0 L400,120.3 L440,129.1 L480,128.4 L520,118.2 L560,101.2 L600,81.4 L640,63.7 L680,52.5 L720,50.4" 
          fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- 冲激信号（红色箭头） -->
    <line x1="160" y1="130" x2="160" y2="56.3" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    <line x1="240" y1="130" x2="240" y2="53.6" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    <line x1="320" y1="130" x2="320" y2="84.4" stroke="#dc2626" stroke-width="2.5" marker-end="url(#imp)"/>
    <line x1="400" y1="130" x2="400" y2="120.3" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    <line x1="480" y1="130" x2="480" y2="128.4" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    <line x1="560" y1="130" x2="560" y2="101.2" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    <line x1="640" y1="130" x2="640" y2="63.7" stroke="#dc2626" stroke-width="2" marker-end="url(#imp)"/>
    
    <!-- 冲激标注 -->
    <text x="340" y="100" font-size="13" fill="#dc2626" font-weight="600">x(τ)·δ(t−τ)</text>
  </g>

  <!-- ==================== 阶段4：积分叠加 ==================== -->
  <g id="stage4" transform="translate(0, 420)">
    <text x="40" y="35" font-size="16" font-weight="bold" fill="#1e293b" font-family="system-ui, sans-serif">④ 无限叠加（积分）还原信号</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="130" x2="720" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <line x1="80" y1="130" x2="80" y2="60" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="730" y="135" font-size="14" fill="#374151">t</text>
    
    <!-- 还原后的信号 -->
    <path d="M80,90 L120,70.8 L160,56.3 L200,50.1 L240,53.6 L280,66.1 L320,84.4 L360,104.0 L400,120.3 L440,129.1 L480,128.4 L520,118.2 L560,101.2 L600,81.4 L640,63.7 L680,52.5 L720,50.4" 
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- 积分公式 -->
    <g transform="translate(420, 95)">
      <text x="0" y="0" font-size="20" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937">x(t) =</text>
      <text x="55" y="2" font-size="34" font-family="Georgia, serif" fill="#1f2937">∫</text>
      <text x="52" y="-14" font-size="14" fill="#1f2937">∞</text>
      <text x="52" y="16" font-size="14" fill="#1f2937">−∞</text>
      <text x="90" y="0" font-size="20" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937">x(τ) δ(t−τ) dτ</text>
    </g>
  </g>
</svg>