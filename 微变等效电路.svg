<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <style>
    .wire { stroke:#111; stroke-width:1.6; fill:none; stroke-linecap:square; }
    .res  { stroke:#111; stroke-width:1.6; fill:#fff; }
    .src  { stroke:#111; stroke-width:1.6; fill:#fff; }
    .gnd  { stroke:#111; stroke-width:1.6; fill:none; }
    .node { fill:#111; }
    .lbl  { font-size:15px; fill:#111; }
    .sub  { font-size:12px; fill:#333; }
    .cur  { stroke:#c0392b; stroke-width:1.6; fill:none; }
    .cur2 { stroke:#1f5fbf; stroke-width:1.6; fill:none; }
  </style>

  <!-- ===== 输入信号源 ui ===== -->
  <circle class="src" cx="70" cy="280" r="26"/>
  <text x="70" y="285" text-anchor="middle" dominant-baseline="middle" font-size="15" font-style="italic">u</text>
  <text x="82" y="293" font-size="12" font-style="italic">i</text>
  <text x="38" y="262" font-size="13">+</text>
  <text x="38" y="305" font-size="13">−</text>
  <!-- 源顶端引线到顶部水平线 -->
  <line class="wire" x1="70" y1="254" x2="70" y2="120"/>
  <line class="wire" x1="70" y1="120" x2="130" y2="120"/>

  <!-- ===== Rb 电阻（水平） ===== -->
  <rect class="res" x="130" y="110" width="90" height="20"/>
  <text x="175" y="100" text-anchor="middle" font-size="14" font-style="italic">R</text>
  <text x="186" y="104" font-size="11" font-style="italic">b</text>
  <text x="175" y="145" text-anchor="middle" font-size="12">100 Ω</text>
  <line class="wire" x1="220" y1="120" x2="280" y2="120"/>

  <!-- 基极电流 ib 方向标识 -->
  <line class="cur" x1="245" y1="110" x2="265" y2="110" marker-end="url(#arrowRed)"/>
  <text x="255" y="100" text-anchor="middle" font-size="13" fill="#c0392b" font-style="italic">i</text>
  <text x="263" y="104" font-size="10" fill="#c0392b" font-style="italic">b</text>

  <!-- ===== B 节点 ===== -->
  <circle class="node" cx="280" cy="120" r="4"/>
  <text x="262" y="115" text-anchor="end" font-size="15" font-weight="bold">B</text>

  <!-- ===== r_be 电阻（B 与 E 之间，竖直） ===== -->
  <line class="wire" x1="280" y1="120" x2="280" y2="160"/>
  <rect class="res" x="270" y="160" width="20" height="80"/>
  <text x="258" y="195" text-anchor="end" font-size="14" font-style="italic">r</text>
  <text x="266" y="199" font-size="11" font-style="italic">be</text>
  <text x="258" y="215" text-anchor="end" font-size="12">≈1.6 kΩ</text>
  <line class="wire" x1="280" y1="240" x2="280" y2="280"/>

  <!-- ===== E 节点 ===== -->
  <circle class="node" cx="280" cy="280" r="4"/>
  <text x="262" y="285" text-anchor="end" font-size="15" font-weight="bold">E</text>

  <!-- ===== E 到受控源底端水平线 ===== -->
  <line class="wire" x1="280" y1="280" x2="560" y2="280"/>

  <!-- ===== 受控电流源 βib（C 与 E 之间，竖直） ===== -->
  <line class="wire" x1="560" y1="280" x2="560" y2="246"/>
  <circle class="src" cx="560" cy="200" r="26"/>
  <!-- 内部箭头：电流方向 C→E（向下） -->
  <line class="cur2" x1="560" y1="180" x2="560" y2="220" marker-end="url(#arrowBlue)"/>
  <text x="560" y="170" text-anchor="middle" font-size="14" fill="#1f5fbf" font-style="italic">β i</text>
  <text x="578" y="174" font-size="11" fill="#1f5fbf" font-style="italic">b</text>
  <line class="wire" x1="560" y1="174" x2="560" y2="120"/>

  <!-- ===== C 节点 ===== -->
  <circle class="node" cx="560" cy="120" r="4"/>
  <text x="578" y="115" font-size="15" font-weight="bold">C</text>

  <!-- ===== Rc 电阻（C 向右再向下到地） ===== -->
  <line class="wire" x1="560" y1="120" x2="680" y2="120"/>
  <line class="wire" x1="680" y1="120" x2="680" y2="160"/>
  <rect class="res" x="670" y="160" width="20" height="80"/>
  <text x="700" y="195" font-size="14" font-style="italic">R</text>
  <text x="711" y="199" font-size="11" font-style="italic">c</text>
  <text x="700" y="215" font-size="12">3 kΩ</text>
  <line class="wire" x1="680" y1="240" x2="680" y2="420"/>

  <!-- ===== Re 电阻（E 向下到地） ===== -->
  <line class="wire" x1="280" y1="280" x2="280" y2="320"/>
  <rect class="res" x="270" y="320" width="20" height="80"/>
  <text x="258" y="355" text-anchor="end" font-size="14" font-style="italic">R</text>
  <text x="269" y="359" font-size="11" font-style="italic">e</text>
  <text x="258" y="375" text-anchor="end" font-size="12">6 kΩ</text>
  <line class="wire" x1="280" y1="400" x2="280" y2="420"/>

  <!-- ===== ui 源底端到地 ===== -->
  <line class="wire" x1="70" y1="306" x2="70" y2="420"/>

  <!-- ===== 输出 uo：从 C 引出，跨到 GND ===== -->
  <line class="wire" x1="560" y1="120" x2="560" y2="70"/>
  <line class="wire" x1="560" y1="70" x2="730" y2="70"/>
  <line class="wire" x1="730" y1="70" x2="730" y2="120"/>
  <circle class="node" cx="730" cy="120" r="3"/>
  <text x="745" y="80" font-size="14" font-style="italic">u</text>
  <text x="756" y="84" font-size="11" font-style="italic">o</text>
  <text x="745" y="100" font-size="13">+</text>
  <text x="745" y="125" font-size="13">−</text>
  <line class="wire" x1="730" y1="120" x2="730" y2="420"/>

  <!-- ===== 接地符号 ===== -->
  <!-- ui 处 -->
  <line class="gnd" x1="55" y1="420" x2="85" y2="420"/>
  <line class="gnd" x1="60" y1="427" x2="80" y2="427"/>
  <line class="gnd" x1="65" y1="434" x2="75" y2="434"/>
  <!-- Re 处 -->
  <line class="gnd" x1="265" y1="420" x2="295" y2="420"/>
  <line class="gnd" x1="270" y1="427" x2="290" y2="427"/>
  <line class="gnd" x1="275" y1="434" x2="285" y2="434"/>
  <!-- Rc 处 -->
  <line class="gnd" x1="665" y1="420" x2="695" y2="420"/>
  <line class="gnd" x1="670" y1="427" x2="690" y2="427"/>
  <line class="gnd" x1="675" y1="434" x2="685" y2="434"/>
  <!-- uo 负端处 -->
  <line class="gnd" x1="715" y1="420" x2="745" y2="420"/>
  <line class="gnd" x1="720" y1="427" x2="740" y2="427"/>
  <line class="gnd" x1="725" y1="434" x2="735" y2="434"/>

  <!-- 标题 -->
  <text x="390" y="475" text-anchor="middle" font-size="13" fill="#555">微变等效电路（交流通路）</text>
</svg>
