<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <style>
      .axis    { stroke:#222; stroke-width:1.6; fill:none; }
      .grid    { stroke:#e6e6e6; stroke-width:1; }
      .curve   { stroke:#1f4e79; stroke-width:1.8; fill:none; }
      .dcLoad  { stroke:#2e7d32; stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
      .acLoad  { stroke:#c0392b; stroke-width:1.8; fill:none; }
      .qPt     { fill:#c0392b; stroke:#7b1f12; stroke-width:1.2; }
      .lbl     { fill:#222; font-size:14px; }
      .lblSm   { fill:#444; font-size:12px; }
      .lblAxis { fill:#222; font-size:15px; font-style:italic; }
      .lblCurve{ fill:#1f4e79; font-size:12px; font-style:italic; }
      .lblDC   { fill:#2e7d32; font-size:12px; }
      .lblAC   { fill:#c0392b; font-size:12px; }
      .region  { font-size:13px; font-weight:600; }
      .dashV   { stroke:#888; stroke-width:1; stroke-dasharray:3 3; fill:none; }
      .swing   { stroke:#c0392b; stroke-width:1.2; fill:none; stroke-dasharray:2 2; }
    </style>
  </defs>

  <!-- background -->
  <rect width="720" height="560" fill="#ffffff"/>

  <!-- plotting area: x from 80 to 660, y from 60 to 480 (origin at 80,480) -->

  <!-- subtle grid -->
  <g class="grid">
    <line x1="200" y1="60" x2="200" y2="480"/>
    <line x1="320" y1="60" x2="320" y2="480"/>
    <line x1="440" y1="60" x2="440" y2="480"/>
    <line x1="560" y1="60" x2="560" y2="480"/>
    <line x1="80"  y1="375" x2="660" y2="375"/>
    <line x1="80"  y1="270" x2="660" y2="270"/>
    <line x1="80"  y1="165" x2="660" y2="165"/>
  </g>

  <!-- axes -->
  <line class="axis" x1="80"  y1="480" x2="680" y2="480" marker-end="url(#arrow)"/>
  <line class="axis" x1="80"  y1="480" x2="80"  y2="40"  marker-end="url(#arrow)"/>

  <!-- axis labels -->
  <text class="lblAxis" x="688" y="486">u_CE</text>
  <text class="lblAxis" x="72"  y="32" text-anchor="end">i_C</text>
  <text class="lblSm"   x="74"  y="496" text-anchor="end">O</text>

  <!-- region labels -->
  <text class="region" x="120" y="80"  fill="#8E44AD">饱和区</text>
  <text class="region" x="340" y="80"  fill="#1f4e79">放大区</text>
  <text class="region" x="580" y="80"  fill="#b9770e">截止区</text>

  <!-- boundary between saturation and active (vertical-ish curve rising steeply) -->
  <path class="curve" d="M150,480 Q160,260 200,200" opacity="0.55"/>

  <!-- output characteristic curves: family of iB curves -->
  <!-- Each curve: rises steeply near saturation, then nearly flat in active region -->
  <!-- iB = 0 (cutoff baseline) -->
  <path class="curve" d="M150,470 Q165,468 220,467 L660,466"/>
  <text class="lblCurve" x="600" y="458">i_B = 0</text>

  <!-- iB = 10µA -->
  <path class="curve" d="M150,460 Q170,420 230,408 L660,406"/>
  <text class="lblCurve" x="595" y="400">i_B = 10µA</text>

  <!-- iB = 20µA -->
  <path class="curve" d="M150,430 Q175,360 240,344 L660,342"/>
  <text class="lblCurve" x="595" y="336">i_B = 20µA</text>

  <!-- iB = 30µA (selected: I_BQ) — highlight -->
  <path class="curve" d="M150,375 Q180,300 250,282 L660,280" stroke-width="2.4"/>
  <text class="lblCurve" x="585" y="274" font-weight="600">i_B = I_BQ = 30µA</text>

  <!-- iB = 40µA -->
  <path class="curve" d="M150,310 Q188,235 260,218 L660,216"/>
  <text class="lblCurve" x="600" y="210">i_B = 40µA</text>

  <!-- iB = 50µA -->
  <path class="curve" d="M150,235 Q198,165 275,152 L660,150"/>
  <text class="lblCurve" x="600" y="144">i_B = 50µA</text>

  <!-- DC load line: from (0, Vcc/Rc) to (Vcc, 0). Use intercepts (80,90) and (640,480) -->
  <line class="dcLoad" x1="80" y1="90" x2="640" y2="480"/>
  <text class="lblDC" x="100" y="110">直流负载线</text>
  <text class="lblDC" x="100" y="125" font-style="italic" font-size="11">斜率 = -1/R_c</text>

  <!-- Q point: intersection of DC load line and i_B=I_BQ curve.
       Choose uCEQ ~ 360 (x=80+360=440? actually use scale).
       Let's place Q at (380, 282) on the highlighted curve. -->
  <!-- dashed projections -->
  <line class="dashV" x1="380" y1="282" x2="380" y2="480"/>
  <line class="dashV" x1="80"  y1="282" x2="380" y2="282"/>
  <text class="lblSm" x="372" y="498" text-anchor="middle">U_CEQ</text>
  <text class="lblSm" x="74"  y="287" text-anchor="end">I_CQ</text>

  <!-- AC load line: steeper than DC, centered at Q, oscillates around Q.
       AC load line passes through Q with slope -1/(Rc || RL). -->
  <line class="acLoad" x1="240" y1="120" x2="500" y2="430"/>
  <text class="lblAC" x="500" y="118">交流负载线</text>
  <text class="lblAC" x="500" y="132" font-style="italic" font-size="11">加信号后沿此线上下摆动</text>

  <!-- Q point marker -->
  <circle class="qPt" cx="380" cy="282" r="6"/>
  <text class="lbl" x="392" y="276" fill="#c0392b" font-weight="600">Q (U_CEQ, I_CQ)</text>

  <!-- swing indicators along AC load line around Q -->
  <circle cx="305" cy="190" r="3" fill="#c0392b"/>
  <circle cx="455" cy="370" r="3" fill="#c0392b"/>
  <path class="swing" d="M305,190 A 75 75 0 0 1 380,282"/>
  <path class="swing" d="M380,282 A 75 75 0 0 1 455,370"/>

  <!-- swing annotations -->
  <text class="lblAC" x="270" y="184" font-size="11">i_B↑</text>
  <text class="lblAC" x="460" y="380" font-size="11">i_B↓</text>

  <!-- footnote -->
  <text class="lblSm" x="80" y="540">注：Q 点必须落在放大区，信号摆动幅度不得超出放大区边界，否则输出失真（饱和削顶或截止削底）。</text>
</svg>
